<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AERO 研究者後台</title>
  <style>
    :root{--ink:#172b3a;--muted:#687985;--line:#dfe6eb;--blue:#24577a;--pale:#f4f7f9;--green:#237a57;--amber:#a45c13}
    *{box-sizing:border-box}body{font-family:"Noto Sans TC",system-ui,sans-serif;margin:0;background:var(--pale);color:var(--ink)}
    .wrap{max-width:1180px;margin:42px auto;padding:0 20px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}h1{margin:0 0 8px;font-size:30px}h2{font-size:18px;margin:0 0 16px}.muted{color:var(--muted);font-size:14px;line-height:1.7;margin:0}
    .login,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px rgba(25,50,68,.04)}
    .login{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;padding:10px 13px;border-radius:9px;border:1px solid #bcc8d1;background:#fff}input{min-width:230px}button{cursor:pointer;background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}.secondary{background:#fff;color:var(--blue)}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.metric{background:#f1f6f9;border-radius:12px;padding:16px}.metric span{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}.metric strong{font-size:25px}.good{color:var(--green)}.warn{color:var(--amber)}
    .design{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.condition{border:1px solid var(--line);border-radius:12px;padding:15px}.condition b{display:block;margin-bottom:6px}.condition small{display:block;color:var(--muted);line-height:1.6}.condition .number{font-size:22px;margin-top:10px}.balance-note{margin-top:14px;padding:11px 13px;border-radius:9px;background:#f3f6f8;font-size:14px}
    .table-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e8edf0;font-size:13px;vertical-align:top}th{color:#5c6f7c;background:#fafbfc;position:sticky;top:0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eaf2f7;color:#24577a;font-weight:700}.rounds{line-height:1.75}.empty{text-align:center;padding:35px;color:var(--muted)}#status{font-size:14px}.error{color:#b42318}.ok{color:var(--green)}
    @media(max-width:800px){.top{display:block}.summary,.design{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><h1>AERO 研究者後台</h1><p class="muted">獨立於受測者問卷。這裡只顯示伺服器實際收到的研究紀錄，不產生模擬資料。</p></div></header>

  <section class="login">
    <button type="button" onclick="loadRecords()">重新整理資料</button>
    <button class="secondary" type="button" onclick="exportCsv()">匯出完整 CSV</button>
    <span id="status">正在讀取本機研究資料…</span>
  </section>

  <section class="card">
    <h2>研究進度總覽</h2>
    <div class="summary">
      <div class="metric"><span>已取得實驗序列</span><strong id="assigned">—</strong></div>
      <div class="metric"><span>已留下研究紀錄</span><strong id="recorded">—</strong></div>
      <div class="metric"><span>完成四個回合</span><strong id="completed">—</strong></div>
      <div class="metric"><span>尚未完成四回合</span><strong id="incomplete">—</strong></div>
    </div>
  </section>

  <section class="card">
    <h2>四種起始序列是否平衡</h2>
    <div id="design" class="design"></div>
    <div id="balance-note" class="balance-note">登入後顯示平衡狀態。</div>
    <p class="muted" style="margin-top:12px">每位受測者都會經歷 A、B、C、D 四種條件，只是出現順序不同。每累積四人，四種起始序列各分配一人。</p>
  </section>

  <section class="card">
    <div class="table-head"><div><h2>受測者紀錄</h2><p class="muted">匿名編號、實驗順序、完成回合與各回合結果。</p></div><select id="filter" onchange="renderRows()"><option value="all">全部受測者</option><option value="complete">只看已完成</option><option value="incomplete">只看未完成</option></select></div>
    <div class="table-wrap"><table><thead><tr><th>匿名編號</th><th>四回合順序</th><th>完成度</th><th>各回合選課與評分</th><th>目前狀態</th><th>最後收到資料</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">請先輸入研究者密碼並登入</td></tr></tbody></table></div>
  </section>
</main><script src="config.js"></script><script src="api-client.js"></script><script>
const CONDITIONS={a:'A 中央路徑 × 高結構',b:'B 中央路徑 × 低結構',c:'C 邊緣路徑 × 高結構',d:'D 邊緣路徑 × 低結構'};
const SEQUENCES=[['A','B','C','D'],['B','C','D','A'],['C','D','A','B'],['D','A','B','C']];
let currentRecords=[];
const el=id=>document.getElementById(id);
async function loadRecords(){el('status').textContent='正在讀取…';try{const response=await fetch('/api/admin/records');if(!response.ok)throw new Error(response.status===401?'研究後台只能在伺服器所在電腦開啟':'伺服器讀取失敗');const data=await response.json();currentRecords=data.records||[];renderSummary(data.summary||{});renderDesign(data.summary?.assignment_counts||[0,0,0,0]);renderRows();el('status').textContent=`更新完成，共 ${currentRecords.length} 筆真實紀錄`;el('status').className='ok'}catch(error){el('status').textContent=error.message;el('status').className='error'}}
function roundsOf(record){return record.currentSessionLog?.behavior_metrics?.round_results||[]}
function renderSummary(summary){const completed=currentRecords.filter(r=>roundsOf(r).length===4).length;el('assigned').textContent=`${summary.assigned_participants||0} 人`;el('recorded').textContent=`${summary.recorded_participants||0} 人`;el('completed').textContent=`${completed} 人`;el('incomplete').textContent=`${currentRecords.length-completed} 人`}
function renderDesign(counts){el('design').innerHTML=SEQUENCES.map((seq,index)=>`<div class="condition"><b>序列 ${index+1}：${seq.join(' → ')}</b><small>${seq.map(k=>CONDITIONS[k.toLowerCase()]).join('<br>')}</small><div class="number">${counts[index]||0} 人</div></div>`).join('');const max=Math.max(...counts),min=Math.min(...counts),balanced=max-min<=1;el('balance-note').innerHTML=balanced?'<span class="good">✓ 分派平衡正常</span>：四組人數差距不超過 1 人。':`<span class="warn">注意：目前最大組與最小組相差 ${max-min} 人。</span>`}
function renderRows(){const mode=el('filter').value;const records=currentRecords.filter(r=>mode==='all'||(mode==='complete'&&roundsOf(r).length===4)||(mode==='incomplete'&&roundsOf(r).length<4));el('rows').innerHTML=records.length?records.map(record=>{const rounds=roundsOf(record),sequence=(record.sequence||[]).map(k=>k.toUpperCase());const details=rounds.map((r,i)=>`R${i+1} ${esc(CONDITIONS[r.scenario_key]||r.scenario_key)}｜課程：${esc(r.selected_course_id||'未記錄')}｜Q1 ${val(r.q1_depthLogic)}、Q2 ${val(r.q2_visualAttraction)}、Q3 ${val(r.q3_purchaseIntent)}`).join('<br>')||'尚無已完成回合';return `<tr><td>${esc(record.currentSessionLog?.participant_id)}</td><td><span class="badge">${esc(sequence.join(' → '))}</span></td><td><strong>${rounds.length}/4</strong></td><td class="rounds">${details}</td><td>${esc(record.progressStage)}</td><td>${formatTime(record.server_received_at)}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">此篩選條件下沒有紀錄</td></tr>'}
async function exportCsv(){try{const response=await fetch('/api/admin/export.csv');if(!response.ok)throw new Error('研究後台只能在伺服器所在電腦匯出');const blob=await response.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aero-research-data.csv';a.click();URL.revokeObjectURL(a.href)}catch(error){el('status').textContent=error.message;el('status').className='error'}}
function val(v){return v===null||v===undefined?'—':v}function formatTime(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('zh-TW')}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
loadRecords();
</script></body></html>
