[build]
  command = "node scripts/generate-course-data.mjs && node scripts/generate-netlify-config.mjs"
  publish = "geo_"

[[redirects]]
  from = "/"
  to = "/AERO.html"
  status = 302
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
