[build]
  command = "node scripts/generate-netlify-config.mjs"
  publish = "geo_"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
